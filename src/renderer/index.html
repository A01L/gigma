<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gigma</title>
    <!-- Launch splash: the layered G of the logo, plain HTML and CSS, painted with the first frame before any
         script runs. It lives inside #root, so React replaces it the moment the app renders: nothing to hide,
         no timer, no delay. Project tabs (#doc=) have their own preloader and skip it. -->
    <script>if (location.hash.indexOf('#doc=') === 0) document.documentElement.className = 'doc'</script>
    <style>
      html, body { margin: 0; height: 100%; background: #1e1e1e; }
      .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1e1e1e; }
      .doc .boot { display: none; }
      /* invisible for the first moments: a fast start shows no flash at all */
      .boot svg { overflow: visible; animation: boot-in 0.3s ease-out 0.15s both; }
      .boot use { translate: calc(var(--i) * 4px) calc(var(--i) * 4px); animation: boot-layers 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * -0.16s); }
      @keyframes boot-in { from { opacity: 0; scale: 0.92; } }
      @keyframes boot-layers {
        0%, 100% { translate: calc(var(--i) * 1.5px) calc(var(--i) * 1.5px); }
        50% { translate: calc(var(--i) * 7.5px) calc(var(--i) * 7.5px); }
      }
      @media (prefers-reduced-motion: reduce) { .boot svg, .boot use { animation: none; } }
    </style>
  </head>
